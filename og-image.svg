<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="50%" style="stop-color:#12121a"/>
      <stop offset="100%" style="stop-color:#0a0a0f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <circle cx="150" cy="100" r="200" fill="rgba(0,212,255,0.08)"/>
  <circle cx="1050" cy="530" r="250" fill="rgba(124,58,237,0.08)"/>
  
  <text x="100" y="180" font-family="system-ui, sans-serif" font-size="28" fill="#8a8a9a" letter-spacing="4">DESARROLLADOR FREELANCE</text>
  
  <text x="100" y="300" font-family="system-ui, sans-serif" font-size="120" font-weight="900" fill="#f0f0f5">Said</text>
  
  <rect x="100" y="340" width="300" height="6" rx="3" fill="url(#accent)" filter="url(#glow)"/>
  
  <text x="100" y="420" font-family="system-ui, sans-serif" font-size="36" fill="#00d4ff" filter="url(#glow)">Desarrollo Web &amp; Apps</text>
  
  <text x="100" y="480" font-family="system-ui, sans-serif" font-size="24" fill="#8a8a9a">📍 Andorra</text>
  
  <text x="100" y="550" font-family="system-ui, sans-serif" font-size="22" fill="#55556a">12+ Proyectos | 4 Sectores | Presupuesto sin compromiso</text>
  
  <g transform="translate(900, 250)">
    <rect x="0" y="0" width="40" height="60" rx="8" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.5"/>
    <rect x="60" y="0" width="40" height="60" rx="8" fill="none" stroke="#7c3aed" stroke-width="2" opacity="0.5"/>
    <rect x="120" y="0" width="40" height="60" rx="8" fill="none" stroke="#ec4899" stroke-width="2" opacity="0.5"/>
  </g>
</svg>
